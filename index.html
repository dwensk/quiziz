<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ICT Quiz — 167 вопросов с вариантами</title>
<style>
:root{
  --bg:#0e1a2b;
  --card:#16263d;
  --ink:#eef4fb;
  --muted:#8fa7c4;
  --line:#24405f;
  --purple:#8854d0;
  --blue:#3867d6;
  --orange:#e58e26;
  --red2:#c0392b;
  --teal:#26c6a9;
  --green:#2ecc71;
  --red:#e74c3c;
  --gold:#f7c744;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{
  font-family:'Segoe UI',system-ui,-apple-system,sans-serif;
  background:var(--bg);color:var(--ink);
  min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:14px;
}
.wrap{width:100%;max-width:720px}
header{text-align:center;margin:6px 0 14px}
header h1{font-size:1.2rem;letter-spacing:.05em;color:var(--teal);text-transform:uppercase}
header p{color:var(--muted);font-size:.82rem;margin-top:3px}

.topics{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-bottom:12px}
.topics button{background:var(--card);border:1px solid var(--line);color:var(--muted);padding:6px 12px;border-radius:999px;font-size:.74rem;cursor:pointer}
.topics button.active{background:var(--teal);color:#03302a;border-color:var(--teal);font-weight:700}

.hud{display:flex;align-items:center;gap:10px;margin-bottom:10px;font-size:.8rem;color:var(--muted)}
.bar{flex:1;height:7px;background:var(--card);border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--teal),var(--gold));width:0%;transition:.3s}
.hud .pts{color:var(--gold);font-weight:700}
.hud .streak{color:var(--orange);font-weight:700}

.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px 18px;box-shadow:0 10px 34px rgba(0,0,0,.4)}
.qtop{display:flex;justify-content:space-between;font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:12px}
.qtop .cat{color:var(--gold)}
.qtext{font-size:1.05rem;line-height:1.5;min-height:74px;margin-bottom:16px}

.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:560px){.opts{grid-template-columns:1fr}}
.opt{
  border:none;border-radius:12px;padding:16px 14px;min-height:76px;
  font-size:.88rem;line-height:1.35;color:#fff;font-weight:600;cursor:pointer;
  text-align:left;transition:transform .1s,filter .15s,opacity .2s;
  display:flex;align-items:center;
}
.opt:active{transform:scale(.98)}
.opt.c0{background:var(--purple)}
.opt.c1{background:var(--blue)}
.opt.c2{background:var(--orange)}
.opt.c3{background:var(--red2)}
.opt.correct{background:var(--green)!important;box-shadow:0 0 0 3px rgba(46,204,113,.4)}
.opt.wrong{background:var(--red)!important;opacity:.9}
.opt.dim{opacity:.35;filter:grayscale(.5)}
.opt:disabled{cursor:default}

.feedback{
  margin-top:14px;border-radius:12px;padding:14px;display:none;animation:pop .25s ease;
  border:1px solid var(--line);background:#10203a;
}
.feedback.show{display:block}
@keyframes pop{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.feedback .verdict{font-weight:700;font-size:.95rem;margin-bottom:8px}
.feedback .verdict.good{color:var(--green)}
.feedback .verdict.badv{color:var(--red)}
.feedback .ru{color:var(--muted);font-size:.86rem;line-height:1.5}
.feedback .en{color:var(--teal);font-size:.88rem;line-height:1.5;margin-bottom:6px}
.nextbtn{
  margin-top:12px;width:100%;padding:14px;border:none;border-radius:12px;
  background:var(--teal);color:#03302a;font-size:.98rem;font-weight:700;cursor:pointer;display:none;
}
.nextbtn.show{display:block}
.nextbtn:active{transform:scale(.98)}

.result{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:34px 22px;text-align:center;display:none}
.result.show{display:block}
.result h2{color:var(--teal)}
.result .big{font-size:2.8rem;font-weight:800;color:var(--gold);margin:10px 0}
.result .stats{color:var(--muted);font-size:.9rem;margin-bottom:6px}
.result p{color:var(--muted);font-size:.9rem;margin-bottom:20px}
.result button{background:var(--teal);color:#03302a;border:none;padding:13px 20px;border-radius:12px;font-size:.95rem;font-weight:700;cursor:pointer;margin:4px}
.result .ghost{background:none;border:1px solid var(--line);color:var(--muted)}
footer{margin-top:16px;color:var(--muted);font-size:.72rem;text-align:center;opacity:.7}
</style>
</head>
<body>
<div class="wrap">
<header>
  <h1>ICT Quiz</h1>
  <p>167 вопросов · 4 варианта ответа · как в Quizizz</p>
</header>

<div class="topics" id="topics"></div>

<div class="hud">
  <span id="pos">1/167</span>
  <div class="bar"><i id="fill"></i></div>
  <span class="pts">★ <b id="pts">0</b></span>
  <span class="streak">🔥 <b id="streak">0</b></span>
</div>

<div class="card" id="card">
  <div class="qtop"><span class="cat" id="cat"></span><span id="counter"></span></div>
  <div class="qtext" id="qtext"></div>
  <div class="opts" id="opts"></div>
  <div class="feedback" id="feedback">
    <div class="verdict" id="verdict"></div>
    <div class="en" id="fen"></div>
    <div class="ru" id="fru"></div>
  </div>
  <button class="nextbtn" id="nextbtn" onclick="next()">Дальше →</button>
</div>

<div class="result" id="result">
  <h2>Квиз завершён!</h2>
  <div class="big" id="pct">0%</div>
  <div class="stats" id="stats"></div>
  <p id="resText"></p>
  <button onclick="reviewMistakes()">Повторить ошибки</button>
  <button class="ghost" onclick="restart()">Заново</button>
</div>

<footer>Выбирай тему сверху, чтобы учить блоками · «Повторить ошибки» — пока не будет 100%</footer>
</div>

<script>

const DATA=[

{t:"Основы ИКТ",q:"2. Since when have academic researchers used the term \"Information and Communication Technology\"?",a:"Since the 1980s",ru:"Термин ИКТ используется учёными с 1980-х годов."},
{t:"Основы ИКТ",q:"3. What is the representation of the Data?",a:"Numbers, text, images, audio, video — in binary form (0 and 1)",ru:"Данные представляются числами, текстом, изображениями, аудио и видео; внутри компьютера — в двоичном виде."},
{t:"Основы ИКТ",q:"4. What is the exchange of information over long distances by electronic means (all voice, data and video)?",a:"Telecommunications",ru:"Телекоммуникации — обмен информацией на больших расстояниях электронными средствами; относится ко всем видам передачи."},

{t:"Основы ИКТ",q:"6. A collection of related documents and resources connected by hyperlinks and URLs?",a:"The World Wide Web (WWW)",ru:"Всемирная паутина — совокупность документов и ресурсов, связанных гиперссылками и URL."},
{t:"Основы ИКТ",q:"7. Give the designation of the prefix \"tele\"?",a:"\"Far away\", \"at a distance\" (Greek)",ru:"«Теле» — греческая приставка, означающая «далеко», «на расстоянии»."},
{t:"Основы ИКТ",q:"8. The application of scientific knowledge for practical purposes, especially in industry?",a:"Technology",ru:"Технология — применение научных знаний в практических целях, особенно в промышленности."},
{t:"Основы ИКТ",q:"9. What is the focus of ICT?",a:"Communication technologies: Internet, wireless networks, cell phones",ru:"Фокус ИКТ — коммуникационные технологии: Интернет, беспроводные сети, мобильная связь."},
{t:"Основы ИКТ",q:"10. The Greek prefix \"tele\" in the word \"telecommunications\" means?",a:"\"Distance / far off\"",ru:"«Теле» означает «расстояние / далеко» — связь на расстоянии."},
{t:"ПО",q:"11. Call 2 types of system software?",a:"Operating systems and utility software",ru:"Два типа системного ПО: операционные системы и утилиты."},
{t:"ПО",q:"12. Operating systems are responsible for what?",a:"Managing hardware and software resources: memory, processes, files, devices",ru:"ОС управляет аппаратными и программными ресурсами: памятью, процессами, файлами, устройствами."},
{t:"ПО",q:"13. System software used to help, analyze, tune, optimize and maintain a computer?",a:"Utility software",ru:"Утилиты — системное ПО для анализа, настройки, оптимизации и обслуживания компьютера."},
{t:"ПО",q:"14. Which term can be classified depending on what it is intended for?",a:"Software (system and application)",ru:"ПО классифицируется по назначению: системное и прикладное."},
{t:"ПО",q:"15. Give a definition of mobile operating system?",a:"An OS designed for mobile devices (smartphones, tablets)",ru:"Мобильная ОС — операционная система для мобильных устройств: смартфонов, планшетов."},
{t:"ПО",q:"16. Give a definition of operating system?",a:"System software that manages hardware/software resources and provides services for programs",ru:"ОС — системное ПО, управляющее ресурсами компьютера и предоставляющее сервисы программам."},
{t:"ПО",q:"17. What helps users solve a particular problem or task (e.g. a word processor)?",a:"Application software",ru:"Прикладное ПО — помогает решать конкретные задачи (пример — текстовый процессор)."},

{t:"ПО",q:"19. The distinguishing ability between Utility Software and OS Software?",a:"Utilities are optional maintenance tools; the OS is essential for the computer to work",ru:"Утилиты — необязательные сервисные программы; ОС необходима для работы компьютера."},
{t:"ПО",q:"20. Which mobile OS is supported on select Apple devices?",a:"iOS",ru:"iOS — мобильная ОС устройств Apple."},
{t:"ПО",q:"21. Google's free open source stack: OS, middleware and key applications?",a:"Android",ru:"Android — открытый стек Google: ОС, промежуточное ПО и ключевые приложения."},
{t:"ПО",q:"22. A set of electronic program instructions or data that a processor reads to perform a task?",a:"Software",ru:"Программное обеспечение — инструкции и данные, которые процессор читает для выполнения задач."},

{t:"Архитектура",q:"24. Who first mentioned the documented architecture of the Analytical Engine in correspondence?",a:"Ada Lovelace",ru:"Ада Лавлейс — в переписке с Чарльзом Бэббиджем."},
{t:"Архитектура",q:"25. Who described the stored program concept in two patent applications while building the Z1 (1936)?",a:"Konrad Zuse",ru:"Конрад Цузе — концепция хранимой программы при создании Z1."},
{t:"Архитектура",q:"26. Whose 1945 paper \"The First Draft Report on EDVAC\" described the organization of logic gates?",a:"John von Neumann",ru:"Джон фон Нейман — «Первый проект отчёта об EDVAC», 1945."},

{t:"Архитектура",q:"28. Give a definition of workstation?",a:"A powerful single-user computer for technical/scientific applications",ru:"Рабочая станция — мощный однопользовательский компьютер для технических и научных задач."},
{t:"Архитектура",q:"29. Give a meaning of the term — bit?",a:"Binary digit — the smallest unit of information (0 or 1)",ru:"Бит — двоичная цифра, наименьшая единица информации (0 или 1)."},
{t:"Архитектура",q:"30. In 1642, the \"Counting Machine\" was invented by whom?",a:"Blaise Pascal",ru:"Блез Паскаль — счётная машина «Паскалина», 1642."},
{t:"Архитектура",q:"31. A basic, complete and functional hardware and software installation for computing performance?",a:"A computer system",ru:"Компьютерная система — полная функциональная установка аппаратного и программного обеспечения."},
{t:"Архитектура",q:"32. A set of rules and methods describing functionality, organization and implementation of computer systems?",a:"Computer architecture",ru:"Архитектура компьютера — правила и методы, описывающие функциональность, организацию и реализацию систем."},
{t:"Архитектура",q:"33. Random access memory — a storage device consisting of silicon microcircuits?",a:"RAM",ru:"ОЗУ (RAM) — оперативная память на кремниевых микросхемах."},
{t:"Архитектура",q:"34–35. The unit that performs all arithmetic and logical operations?",a:"ALU (Arithmetic Logic Unit)",ru:"АЛУ — арифметико-логическое устройство, часть процессора."},
{t:"Архитектура",q:"36. The fastest type of RAM that does not use the capacitive method?",a:"SRAM (Static RAM)",ru:"SRAM — статическая память, один из самых быстрых типов ОЗУ."},
{t:"Архитектура",q:"37. What PC device is on plug-in boards on the motherboard or on the same chip as the CPU?",a:"The GPU (video adapter)",ru:"Графический процессор / видеоадаптер — на видеокарте или интегрирован в чип процессора."},

{t:"Архитектура",q:"39. What applies to input devices?",a:"Keyboard, mouse, scanner, microphone, touchscreen",ru:"Устройства ввода: клавиатура, мышь, сканер, микрофон, сенсорный экран."},
{t:"Архитектура",q:"40. The critical size that determines how much information you can store on a device?",a:"Storage capacity",ru:"Ёмкость памяти — определяет объём хранимой информации."},
{t:"HCI",q:"41. What does HCI (Human Computer Interaction) study?",a:"The design, evaluation and implementation of interactive systems for human use",ru:"HCI изучает проектирование, оценку и реализацию интерактивных систем для людей."},
{t:"HCI",q:"42. Give a definition of user interface?",a:"The means by which the user and the computer system interact",ru:"Пользовательский интерфейс — средства взаимодействия пользователя и компьютера."},
{t:"HCI",q:"43. UI form where the user issues commands by selecting and clicking icons on screen?",a:"Graphical User Interface (GUI)",ru:"Графический интерфейс (GUI) — команды подаются нажатием на иконки."},
{t:"HCI",q:"44. Character-oriented user interface type?",a:"Command Line Interface (CLI)",ru:"Интерфейс командной строки — символьно-ориентированный тип."},
{t:"HCI",q:"45. The purpose of a graphical user interface (GUI)?",a:"To make interaction simple and intuitive with windows, icons, menus",ru:"Цель GUI — сделать взаимодействие простым и интуитивным (окна, иконки, меню)."},
{t:"HCI",q:"46. Call a name of golden rule in HCI?",a:"\"Know your user\"",ru:"Золотое правило HCI — «Знай своего пользователя»."},
{t:"HCI",q:"47. What three disciplines in HCI interact with each other?",a:"Computer science, cognitive psychology, design (ergonomics)",ru:"Информатика, когнитивная психология и дизайн (эргономика)."},
{t:"HCI",q:"48. Call a goal of development of HCI?",a:"To improve usability: effective, safe and enjoyable interaction",ru:"Цель HCI — удобство: эффективное, безопасное и приятное взаимодействие."},
{t:"Базы данных",q:"49. Give a definition of database?",a:"An organized collection of structured, related data stored electronically",ru:"База данных — организованная совокупность структурированных связанных данных."},
{t:"Базы данных",q:"50. Three classical logical models of databases?",a:"Hierarchical, network, relational",ru:"Три классические модели: иерархическая, сетевая, реляционная."},

{t:"Базы данных",q:"53. Give a definition of object-relational mapping (ORM)?",a:"A technique mapping code objects to relational database tables",ru:"ORM — техника связывания объектов кода с таблицами реляционной БД."},

{t:"Базы данных",q:"56. Give a definition of normalization?",a:"Organizing data to reduce redundancy and improve integrity",ru:"Нормализация — организация данных для уменьшения избыточности и повышения целостности."},
{t:"Базы данных",q:"57. A set of discrete pieces of information formatted for analysis or decision making?",a:"Data",ru:"Данные — дискретные фрагменты информации, организованные для анализа и решений."},
{t:"Базы данных",q:"59. Give a notation for a large set of related data?",a:"A database",ru:"База данных — большой набор связанных данных."},
{t:"Базы данных",q:"60. What is the concept of a computerized data storage system?",a:"A database management system (DBMS)",ru:"СУБД — компьютеризированная система хранения и управления данными."},
{t:"Базы данных",q:"61. What is a flexible approach?",a:"Agile — an iterative approach with short cycles and constant feedback",ru:"Agile — гибкий итеративный подход с короткими циклами и обратной связью."},

{t:"Data Mining",q:"65. What refers to Data mining methods?",a:"Classification, clustering, association, prediction, sequence discovery",ru:"Методы: классификация, кластеризация, ассоциация, прогнозирование, обнаружение последовательностей."},

{t:"Сети",q:"74. \"Sufficiently powerful computers for high speed data transmission and query processing\"?",a:"Servers",ru:"Серверы — мощные компьютеры для высокоскоростной передачи данных и обработки запросов."},
{t:"Сети",q:"75. \"The physical medium in which information signals are transmitted\"?",a:"Communication channels (transmission medium)",ru:"Каналы связи — физическая среда передачи информационных сигналов."},
{t:"Сети",q:"76. What type of network unites resources of computers located over long distances?",a:"WAN (Wide Area Network)",ru:"Глобальная сеть (WAN) объединяет компьютеры на больших расстояниях."},

let deck=[], idx=0, pts=0, streak=0, ok=0, bad=0, wrong=[], topic="Все", locked=false;

const topics=["Все",...new Set(DATA.map(d=>d.t))];
const tEl=document.getElementById('topics');
topics.forEach(t=>{
  const b=document.createElement('button');
  b.textContent=t;
  if(t===topic)b.classList.add('active');
  b.onclick=()=>{topic=t;document.querySelectorAll('.topics button').forEach(x=>x.classList.remove('active'));b.classList.add('active');restart();};
  tEl.appendChild(b);
});

function shuffle(arr){for(let i=arr.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]];}return arr;}

function makeOptions(qi){
  const correct=DATA[qi].a;
  // distractors: answers from same topic first, then anywhere
  let pool=DATA.map((d,i)=>i).filter(i=>i!==qi&&DATA[i].t===DATA[qi].t&&DATA[i].a!==correct);
  let extra=DATA.map((d,i)=>i).filter(i=>i!==qi&&DATA[i].a!==correct);
  shuffle(pool);shuffle(extra);
  const seen=new Set([correct]);
  const distractors=[];
  for(const src of [pool,extra]){
    for(const i of src){
      if(distractors.length>=3)break;
      const a=DATA[i].a;
      if(!seen.has(a)){seen.add(a);distractors.push(a);}
    }
    if(distractors.length>=3)break;
  }
  return shuffle([correct,...distractors]);
}

function buildDeck(){
  deck=DATA.map((d,i)=>i).filter(i=>topic==="Все"||DATA[i].t===topic);
  shuffle(deck);
}

function render(){
  document.getElementById('result').classList.remove('show');
  document.getElementById('card').style.display='block';
  locked=false;
  const qi=deck[idx], d=DATA[qi];
  document.getElementById('cat').textContent=d.t;
  document.getElementById('counter').textContent=`Вопрос ${idx+1} из ${deck.length}`;
  document.getElementById('qtext').textContent=d.q;
  document.getElementById('pos').textContent=`${idx+1}/${deck.length}`;
  document.getElementById('fill').style.width=(idx/deck.length*100)+'%';
  document.getElementById('pts').textContent=pts;
  document.getElementById('streak').textContent=streak;
  document.getElementById('feedback').classList.remove('show');
  document.getElementById('nextbtn').classList.remove('show');
  const opts=makeOptions(qi);
  const box=document.getElementById('opts');
  box.innerHTML='';
  opts.forEach((o,i)=>{
    const b=document.createElement('button');
    b.className='opt c'+i;
    b.textContent=o;
    b.onclick=()=>answer(b,o,qi);
    box.appendChild(b);
  });
}

function answer(btn,chosen,qi){
  if(locked)return;locked=true;
  const correct=DATA[qi].a;
  const good=chosen===correct;
  document.querySelectorAll('.opt').forEach(b=>{
    b.disabled=true;
    if(b.textContent===correct)b.classList.add('correct');
    else if(b===btn)b.classList.add('wrong');
    else b.classList.add('dim');
  });
  const fb=document.getElementById('feedback');
  const v=document.getElementById('verdict');
  if(good){
    ok++;streak++;
    pts+=100+Math.min(streak-1,5)*20; // streak bonus
    v.textContent=`Верно! +${100+Math.min(streak-1,5)*20} очков`+(streak>=3?` · серия ${streak} 🔥`:'');
    v.className='verdict good';
  }else{
    bad++;streak=0;wrong.push(qi);
    v.textContent='Неверно. Правильный ответ подсвечен зелёным.';
    v.className='verdict badv';
  }
  document.getElementById('fen').textContent=correct;
  document.getElementById('fru').textContent=DATA[qi].ru;
  fb.classList.add('show');
  document.getElementById('pts').textContent=pts;
  document.getElementById('streak').textContent=streak;
  document.getElementById('nextbtn').classList.add('show');
}

function next(){
  if(idx+1>=deck.length){finish();return;}
  idx++;render();
}

function finish(){
  document.getElementById('card').style.display='none';
  const r=document.getElementById('result');
  r.classList.add('show');
  const total=ok+bad;
  const pct=total?Math.round(ok/total*100):0;
  document.getElementById('pct').textContent=pct+'%';
  document.getElementById('stats').textContent=`Правильно: ${ok} · Ошибок: ${bad} · Очки: ${pts}`;
  let msg;
  if(pct>=90)msg='Красавчик! Ты готов к экзамену 🔥';
  else if(pct>=70)msg='Хорошо! Добей ошибки — и будет идеально.';
  else msg='Нормальный старт. Жми «Повторить ошибки» и закрепляй.';
  document.getElementById('resText').textContent=msg;
  document.getElementById('fill').style.width='100%';
}

function reviewMistakes(){
  if(wrong.length===0){restart();return;}
  deck=shuffle([...new Set(wrong)]);
  wrong=[];idx=0;ok=0;bad=0;streak=0;
  render();
}

function restart(){
  buildDeck();
  wrong=[];idx=0;pts=0;streak=0;ok=0;bad=0;
  render();
}
restart();
</script>
